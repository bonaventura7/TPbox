name: Guardrail CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          set +e
          npm ci 2>&1 | tee /tmp/npm-ci.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -q '@lovable.dev/vite-tanstack-config@2\.9\.1' /tmp/npm-ci.log && \
             grep -q '@lovable.dev/vite-tanstack-config@2\.13\.1' /tmp/npm-ci.log; then
            echo 'Known pre-existing package.json/package-lock.json mismatch detected; using lockfile-neutral install fallback.'
            npm install --package-lock=false --no-audit --no-fund
            exit $?
          fi

          echo 'npm ci failed for an unexpected reason; preserving the original failure.'
          exit "$status"
      - name: Run source, quality, authorization and LLM guardrails
        run: npx vitest run test/source-gate.test.ts test/source-registry-sync.test.ts test/feed-primary-url.test.ts test/draft-quality.test.ts test/error-message.test.ts test/auth-policy.test.ts test/llm-provider.test.ts test/auth-before-llm.test.ts src/lib/company-finder/greek-filing.test.ts src/lib/market-data/treasury.test.ts src/lib/market-data/treasury-registry.test.ts
