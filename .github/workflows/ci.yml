name: Guardrail CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run source, quality, authorization and LLM guardrails
        run: npx vitest run test/source-gate.test.ts test/source-registry-sync.test.ts test/feed-primary-url.test.ts test/draft-quality.test.ts test/error-message.test.ts test/auth-policy.test.ts test/llm-provider.test.ts test/auth-before-llm.test.ts src/lib/company-finder/greek-filing.test.ts
