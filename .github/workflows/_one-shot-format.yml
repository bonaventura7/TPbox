name: One-shot repository formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prettier --write "src/**/*.ts" "src/**/*.tsx" "lib/**/*.ts" "test/**/*.ts" "tests/**/*.ts" "supabase/functions/**/*.ts" "eslint.config.js"
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Linted source files already formatted."
            exit 0
          fi
          git add src lib test tests supabase/functions eslint.config.js
          git commit -m "chore: format linted source files"
          git push
