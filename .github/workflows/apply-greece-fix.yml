name: Apply Greece GEMI fix

on:
  push:
    branches:
      - fix/greece-gemi-financials

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Greece adapter wiring
        run: node scripts/apply-greece-patch.mjs

      - name: Diff sanity
        run: git diff --check

      - name: Format new Greece files
        run: npx prettier --write src/lib/company-finder/sources/bilanci/gemi-gr.ts src/lib/company-finder/sources/bilanci/gemi-gr.test.ts src/lib/company-finder/sources/bilanci/gemi-gr-financials.ts

      - name: Targeted lint for Greece files
        run: npx eslint src/lib/company-finder/sources/bilanci/gemi-gr.ts src/lib/company-finder/sources/bilanci/gemi-gr.test.ts src/lib/company-finder/sources/bilanci/gemi-gr-financials.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Remove one-shot patch tooling
        run: rm -f scripts/apply-greece-patch.mjs .github/workflows/apply-greece-fix.yml

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(greece): wire GEMI financials into company finder"
          git push
